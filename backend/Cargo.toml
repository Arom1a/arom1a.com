[package]
name = "arom1a-api"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
dotenvy = "0.15.7"
sqlx = { version = "0.9.0", features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
